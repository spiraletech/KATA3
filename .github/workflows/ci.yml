name: KATA3 C++20 CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Package tested console application
        if: matrix.configuration == 'Release'
        working-directory: build
        run: cpack -C ${{ matrix.configuration }} -G ZIP
      - name: Upload release package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: kata3-play-${{ matrix.os }}
          path: build/KATA3-Play-*.zip
          if-no-files-found: error
